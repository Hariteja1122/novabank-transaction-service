name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novabank-transaction-service
    steps:
      - uses: actions/checkout@v4
        with:
          path: novabank-transaction-service
      # The Db2 integration tests load the schema owned by novabank-platform,
      # so check it out side by side, the same layout as on a laptop.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/novabank-platform
          path: novabank-platform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: novabank-transaction-service/pom.xml
      - name: Build, unit and Db2 integration tests
        run: mvn -B verify
      - name: Build Docker image
        run: docker build -t novabank-transaction-service:ci .
